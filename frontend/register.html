<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DevFlow - Create Account</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <h1>
                    Create your DevFlow account
                </h1>

                <p>
                    Start managing your projects,
                    tasks, and clients.
                </p>

            </div>


            <form id="register-form">

                <div class="form-group">

                    <label for="register-name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="register-name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="register-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="register-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="register-confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="register-confirm-password"
                        required
                    >

                </div>


                <p
                    id="register-error"
                    class="form-error hidden"
                ></p>


                <button
                    type="submit"
                    class="primary-button auth-button"
                >
                    Create Account
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Log in
                    </a>
                </p>

            </div>

        </div>

    </main>


    <script src="register.js"></script>

</body>

</html>
