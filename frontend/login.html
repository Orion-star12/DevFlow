<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DevFlow - Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <h1>
                    Welcome back
                </h1>

                <p>
                    Log in to continue to DevFlow.
                </p>

            </div>


            <form id="login-form">

                <div class="form-group">

                    <label for="login-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        required
                    >

                </div>


                <p
                    id="login-error"
                    class="form-error hidden"
                ></p>


                <button
                    type="submit"
                    class="primary-button auth-button"
                >
                    Log In
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create one
                    </a>
                </p>

            </div>

        </div>

    </main>


    <script src="login.js"></script>

</body>

</html>
